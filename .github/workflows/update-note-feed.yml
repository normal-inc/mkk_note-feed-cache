name: Update note feed cache

on:
  schedule:
    # 毎時0分に実行（UTC基準。日本時間からは9時間マイナスした時刻）
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch note feeds
        run: node scripts/fetch-note-feeds.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: update note feed cache $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
