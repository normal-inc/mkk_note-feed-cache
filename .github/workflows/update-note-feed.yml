name: Update note feed cache

on:
  schedule:
    # 毎時17分に実行（UTC基準。日本時間からは9時間プラス）
    # 毎時0分は最も混み合う時間帯で遅延・間引きが発生しやすいため、0分ちょうどを避けている
    - cron: '17 * * * *'
  workflow_dispatch: {}

# 同時に複数走らせない（re-runや実行タイミングの重なりによるpush競合を防ぐ）
concurrency:
  group: update-note-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch note feeds
        run: node scripts/fetch-note-feeds.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: update note feed cache $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push
